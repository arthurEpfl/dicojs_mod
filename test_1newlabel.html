<!DOCTYPE html>
<html lang="en">

  <body>
    <script type="module">
      import Antibiogo from './dist/msf/trainer/antibiogo.js';

      Antibiogo.init().then((antibiogo) => {
        console.log('Initialized Antibiogo:', antibiogo);

        const embeddings = '[[...]]'; // Example embeddings
